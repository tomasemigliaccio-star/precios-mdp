name: Actualizar precios

on:
  schedule:
    - cron: "0 16 * * *"   # todos los días 13:00 hora Argentina (16:00 UTC)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y filtrar el SEPA
        env:
          SEPA_URL: ${{ vars.SEPA_URL }}
          ZONA: ${{ vars.ZONA }}
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          URL="$SEPA_URL"
          if [ -z "$URL" ]; then
            # Busca solo el enlace del zip de AYER en la página oficial (hay un zip por día de la semana)
            NOMBRES=(x lunes martes miercoles jueves viernes sabado domingo)
            DIA=${NOMBRES[$(TZ=America/Argentina/Buenos_Aires date -d yesterday +%u)]}
            echo "Buscando el enlace en la página oficial..."
            curl -sS -L --fail --retry 2 --connect-timeout 30 --max-time 120 -A "$UA" -w "Página oficial: HTTP %{http_code}\n" -o pagina.html "https://datos.gob.ar/dataset/produccion-precios-claros---base-sepa"
            URL=$(grep -oE "https://datos\.produccion\.gob\.ar/[^\"' )<>]*/download/sepa_${DIA}\.zip" pagina.html | head -n1 || true)
          fi
          if [ -z "$URL" ]; then echo "No encontré el enlace de descarga del SEPA"; exit 1; fi
          echo "Descargando $URL"
          curl -sS -L --fail --retry 2 --connect-timeout 30 --max-time 7200 -A "$UA" -w "Descarga: HTTP %{http_code}, %{size_download} bytes\n" -o sepa.zip "$URL"
          ls -lh sepa.zip
          mkdir -p sitio/datos
          python filtrar_sepa.py sepa.zip --zona "${ZONA:-Mar del Plata}" --liviano --salida sitio/datos
          cp index.html sitio/
          TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M' > sitio/datos/fecha.txt
          rm sepa.zip
          ls -lh sitio/datos

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
