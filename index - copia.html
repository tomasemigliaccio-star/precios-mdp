<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador de menor precio</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#dde1e6;--ac:#0b7a4b;--acbg:#e3f4eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2226;--tx:#e8ebee;--mu:#9aa5b1;--bd:#2e353b;--ac:#4cc58d;--acbg:#173a2a}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2226;--tx:#e8ebee;--mu:#9aa5b1;--bd:#2e353b;--ac:#4cc58d;--acbg:#173a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 200px;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
button,label.btn{padding:10px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:.95rem;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.st{font-size:.88rem;color:var(--mu);margin-top:8px}
.best{background:var(--acbg);border:1px solid var(--ac);border-radius:10px;padding:10px 12px;margin:8px 0}
.best b.p{font-size:1.5rem;color:var(--ac)}
.pn{font-weight:600}.mu{color:var(--mu);font-size:.88rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:6px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td.n,th.n{text-align:right}
details summary{cursor:pointer;color:var(--mu);font-size:.9rem}
.tag{background:var(--acbg);color:var(--ac);border-radius:6px;padding:1px 6px;font-size:.78rem;margin-left:4px}
</style>
</head>
<body>
<main>
<h1>🛒 Buscador de menor precio</h1>
<p class="sub">Buscá un producto por nombre o código de barras y mirá dónde está más barato.</p>

<div class="card">
  <div class="row">
    <label class="btn">Cargar archivos SEPA<input id="f" type="file" accept=".csv,.txt" multiple hidden></label>
    <button id="demo">Ver con datos de ejemplo</button>
  </div>
  <div class="st" id="st">Seleccioná juntos los archivos <b>productos</b>, <b>sucursales</b> y <b>comercio</b> (CSV) de SEPA. Se procesan en tu navegador y no se suben a ningún lado.</div>
</div>

<div class="card">
  <div class="row">
    <input type="text" id="q" placeholder="Producto o código de barras (ej.: leche entera 1 l)">
    <input type="text" id="loc" placeholder="Localidad (ej.: Mar del Plata)">
  </div>
</div>
<div id="out"></div>
</main>

<script>
(function(){
var P=[],S={},C={};
var $=function(i){return document.getElementById(i)};
var money=function(n){return n.toLocaleString('es-AR',{style:'currency',currency:'ARS'})};
var norm=function(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
function esc(s){return (s||'').toString().replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function parse(text){
  var first=text.slice(0,text.indexOf('\n')>0?text.indexOf('\n'):text.length);
  var d=(first.split('|').length>first.split(',').length)?'|':',';
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"'&&d===','){q=true}
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}
    else f+=c;
  }
  if(f||row.length){row.push(f.replace(/\r$/,''));rows.push(row)}
  var h=rows.shift().map(function(x){return x.trim().replace(/^\ufeff/,'').toLowerCase()});
  return {h:h,rows:rows};
}
function col(h,names){for(var n=0;n<names.length;n++){var i=h.indexOf(names[n]);if(i>=0)return i}return -1}
function num(x){var v=parseFloat((x||'').toString().replace(',','.'));return isNaN(v)?0:v}
function key(r,h){return [r[col(h,['id_comercio'])],r[col(h,['id_bandera'])],r[col(h,['id_sucursal'])]].join('|')}

function ingest(name,text){
  var t=parse(text),h=t.h,n=norm(name);
  if(n.indexOf('producto')>=0){
    var ie=col(h,['productos_ean']),idd=col(h,['productos_descripcion']),im=col(h,['productos_marca']),
        ip=col(h,['productos_precio_lista']),ipr=col(h,['productos_precio_unitario_promo1']),iu=col(h,['productos_cantidad_presentacion']),ium=col(h,['productos_unidad_medida_presentacion']);
    t.rows.forEach(function(r){
      if(r.length<5)return;
      var p=num(r[ip]),pr=ipr>=0?num(r[ipr]):0,best=p;
      if(pr>0&&(p===0||pr<p))best=pr;
      if(best>0)P.push({e:r[ie],d:r[idd],n:norm(r[idd]+' '+(im>=0?r[im]:'')),m:im>=0?r[im]:'',pres:(iu>=0?r[iu]:'')+' '+(ium>=0?r[ium]:''),p:best,promo:pr>0&&pr<p,k:key(r,h)});
    });
  }else if(n.indexOf('sucursal')>=0){
    var a=col(h,['sucursales_nombre']),c=col(h,['sucursales_calle']),nu=col(h,['sucursales_numero']),l=col(h,['sucursales_localidad']),pv=col(h,['sucursales_provincia']);
    t.rows.forEach(function(r){S[key(r,h)]={n:r[a],a:((r[c]||'')+' '+(nu>=0?r[nu]:'')).trim(),l:l>=0?r[l]:'',pv:pv>=0?r[pv]:'',ln:norm((l>=0?r[l]:'')+' '+(pv>=0?r[pv]:''))}});
  }else if(n.indexOf('comercio')>=0){
    var b=col(h,['comercio_bandera_nombre']);
    t.rows.forEach(function(r){C[r[col(h,['id_comercio'])]+'|'+r[col(h,['id_bandera'])]]=r[b]});
  }
}

$('f').addEventListener('change',async function(e){
  var fs=[].slice.call(e.target.files);P=[];S={};C={};
  $('st').textContent='Procesando '+fs.length+' archivo(s)…';
  try{
    for(var i=0;i<fs.length;i++){ingest(fs[i].name,await fs[i].text())}
    $('st').textContent='Listo: '+P.length.toLocaleString('es-AR')+' precios cargados.';
    if(!P.length)$('st').textContent+=' No encontré un archivo de productos: revisá los nombres de los archivos.';
  }catch(err){$('st').textContent='No pude leer los archivos (pueden ser demasiado grandes). Probá con menos archivos.'}
  render();
});

$('demo').addEventListener('click',function(){
  C={'1|1':'Súper Ejemplo A','1|2':'Súper Ejemplo B','2|1':'Mercado Ejemplo C'};
  S={'1|1|1':{n:'Centro',a:'Calle 1 100',l:'Mar del Plata',pv:'Buenos Aires'},
     '1|2|1':{n:'Güemes',a:'Calle 2 200',l:'Mar del Plata',pv:'Buenos Aires'},
     '2|1|1':{n:'Sucursal 3',a:'Calle 3 300',l:'Mar del Plata',pv:'Buenos Aires'},
     '2|1|2':{n:'Sucursal 4',a:'Calle 4 400',l:'Batán',pv:'Buenos Aires'}};
  var D=[['7790001','Leche entera 1 l','Marca X','1 lt',[1450,1390,1520,1360]],['7790002','Leche entera 1 l','Marca Y','1 lt',[1600,1580,1700,1650]],['7790003','Yogur firmeza vainilla 190 g','Marca Z','190 gr',[980,1010,940,0]],['7790004','Pan lactal 400 g','Marca W','400 gr',[2100,1990,2250,2300]]];
  var ks=['1|1|1','1|2|1','2|1|1','2|1|2'];P=[];for(var k in S)S[k].ln=norm(S[k].l+' '+S[k].pv);
  D.forEach(function(x){x[4].forEach(function(p,i){if(p>0)P.push({e:x[0],d:x[1],n:norm(x[1]+' '+x[2]),m:x[2],pres:x[3],p:p,promo:i===1&&x[0]==='7790001',k:ks[i]})})});
  $('st').textContent='Datos de ejemplo ficticios cargados. Probá buscar “leche” o “pan”.';
  render();
});

function render(){
  var q=norm($('q').value).trim(),loc=norm($('loc').value).trim(),out=$('out');
  if(!P.length){out.innerHTML='';return}
  if(!q){out.innerHTML='<p class="mu">Escribí un producto para buscar.</p>';return}
  var toks=q.split(/\s+/),g={},raw=$('q').value.trim();
  for(var i=0;i<P.length;i++){
    var x=P[i];
    var ok=x.e===raw;if(!ok){ok=true;for(var j=0;j<toks.length;j++){if(x.n.indexOf(toks[j])<0){ok=false;break}}}if(!ok)continue;
    var s=S[x.k]||{};
    if(loc&&(s.ln||'').indexOf(loc)<0)continue;
    var gk=x.e+'|'+x.d;
    (g[gk]=g[gk]||{d:x.d,m:x.m,pres:x.pres,e:x.e,o:[]}).o.push({p:x.p,promo:x.promo,s:s,c:C[x.k.split('|').slice(0,2).join('|')]||'—'});
  }
  var list=Object.keys(g).map(function(k){var z=g[k];z.o.sort(function(a,b){return a.p-b.p});return z});
  list.sort(function(a,b){return a.o[0].p-b.o[0].p});
  if(!list.length){out.innerHTML='<p class="mu">Sin resultados con esos filtros.</p>';return}
  out.innerHTML=list.slice(0,40).map(function(z){
    var b=z.o[0];
    var rows=z.o.map(function(o,i){return '<tr><td>'+esc(o.c)+'</td><td>'+esc(o.s.n||'')+'</td><td>'+esc((o.s.a||'')+(o.s.l?', '+o.s.l:''))+'</td><td class="n">'+money(o.p)+(o.promo?'<span class="tag">promo</span>':'')+'</td></tr>'}).join('');
    return '<div class="card"><div class="pn">'+esc(z.d)+'</div><div class="mu">'+esc(z.m)+' · '+esc(z.pres.trim())+' · EAN '+esc(z.e)+'</div>'+
      '<div class="best"><b class="p">'+money(b.p)+'</b> en <b>'+esc(b.c)+'</b> — '+esc(b.s.n||'')+' <span class="mu">'+esc((b.s.a||'')+(b.s.l?', '+b.s.l:''))+'</span></div>'+
      '<details><summary>Ver las '+z.o.length+' opciones</summary><div class="tw"><table><tr><th>Cadena</th><th>Sucursal</th><th>Dirección</th><th class="n">Precio</th></tr>'+rows+'</table></div></details></div>';
  }).join('');
}
var tm;function deb(){clearTimeout(tm);tm=setTimeout(render,300)}
$('q').addEventListener('input',deb);$('loc').addEventListener('input',deb);
async function auto(){
  try{
    var names=['comercio','sucursales','productos'];
    $('st').textContent='Cargando precios actualizados…';
    var res=await Promise.all(names.map(function(n){return fetch('datos/'+n+'.csv').then(function(r){if(!r.ok)throw 0;return r.text()})}));
    P=[];S={};C={};
    names.forEach(function(n,i){ingest(n+'.csv',res[i])});
    var fe='';try{fe=(await (await fetch('datos/fecha.txt')).text()).trim()}catch(e){}
    $('st').textContent=P.length.toLocaleString('es-AR')+' precios cargados'+(fe?' · actualizados el '+fe:'')+'.';
    render();
  }catch(e){$('st').textContent='No pude cargar los precios automáticos. Podés cargar los archivos a mano.'}
}
if(location.protocol.indexOf('http')===0&&location.hostname!=='claude.ai')auto();
})();
</script>
</body>
</html>
